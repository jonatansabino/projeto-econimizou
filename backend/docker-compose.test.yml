# MariaDB descartável e isolado: sem portas públicas e sem volumes de desenvolvimento.
services:
  app-test:
    image: economizou-api-app
    profiles: ["test"]
    restart: "no"
    ports:
      - "8082:80"
    environment:
      CI_ENVIRONMENT: testing
      app_baseURL: http://127.0.0.1:8082/
      authapi_testRateMultiplier: "1000"
      TZ: America/Sao_Paulo
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
    tmpfs:
      - /var/www/html/writable
    depends_on:
      db-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost/health') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 12
  db-test:
    image: mariadb:11.4
    profiles: ["test"]
    restart: "no"
    environment:
      MARIADB_DATABASE: economizou_test
      MARIADB_USER: economizou_test
      MARIADB_PASSWORD: economizou_test
      MARIADB_ROOT_PASSWORD: test_root
      TZ: America/Sao_Paulo
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12
